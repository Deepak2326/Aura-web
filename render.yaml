services:
  - type: web
    name: aura-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_AUTO_CREATE
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CRM_PROVIDER
        value: mock

databases:
  - name: aura-db
    databaseName: aura
    user: aura
    plan: free

